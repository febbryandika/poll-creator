name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: poll
          POSTGRES_PASSWORD: poll
          POSTGRES_DB: poll_creator # maintenance db; globalSetup creates poll_creator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poll -d poll_creator"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://poll:poll@localhost:5432/poll_creator_test
      DATABASE_URL: postgresql://poll:poll@localhost:5432/poll_creator_test
      REDIS_URL: redis://localhost:6379 # enables the live-push SSE test in CI
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r lint

      - run: pnpm -r typecheck

      - run: pnpm test # Vitest: unit + integration + realtime (globalSetup migrates the test DB)
