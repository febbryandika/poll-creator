services:
  postgres:
    image: postgres:16-alpine
    container_name: poll-creator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: poll
      POSTGRES_PASSWORD: poll
      POSTGRES_DB: poll_creator
    ports:
      # Host port is overridable (compose reads a repo-root .env); default 5432.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - poll-creator-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poll -d poll_creator']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  poll-creator-pgdata:
