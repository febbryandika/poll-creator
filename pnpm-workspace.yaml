packages:
  - apps/*
  - packages/*

# Build scripts we intentionally do not run (declared by create-next-app).
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Shared versions for cross-cutting tooling. Reference with "catalog:" in a package.
catalog:
  typescript: ^5.9.0
  eslint: ^9.0.0
  '@eslint/js': ^9.0.0
  typescript-eslint: ^8.0.0
  eslint-config-prettier: ^10.0.0
  prettier: ^3.4.0
  drizzle-orm: ^0.45.0
